table:
  name: day_type
  schema: timetables
configuration:
  custom_name: service_calendar_day_type
array_relationships:
  - name: active_on_days_of_week
    using:
      foreign_key_constraint_on:
        column: day_type_id
        table:
          name: day_type_active_on_day_of_week
          schema: timetables
  - name: vehicle_services
    using:
      foreign_key_constraint_on:
        column: day_type_id
        table:
          name: vehicle_service
          schema: timetables
